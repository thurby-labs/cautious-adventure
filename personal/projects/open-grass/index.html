<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Youth 5v5 flag football play tester: overlay a coverage, animate the play, find the open grass.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='10' fill='%231C5A37'/%3E%3Cellipse cx='25' cy='24' rx='11' ry='7' fill='%23EBF25A'/%3E%3Ccircle cx='13' cy='13' r='3.2' fill='%23fff'/%3E%3Ccircle cx='33' cy='12' r='3.2' fill='%23fff'/%3E%3C/svg%3E">
<title>Open Grass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: sideline clipboard. Field is the hero on the left; the coach's read sits in a column on the right, stacking under the field on phones. */
:root {
  --paper: #EEF2EA; --panel: #FFFFFF; --ink: #15201A; --muted: #5B6A60; --line: #D5DECF; --chip: #E3EADD;
  --accent: #1C5A37; --accent-ink: #FFFFFF;
  --turf: #B3D7A2; --turf-2: #A9D097; --chalk: #FFFFFF; --hole: #EBF25A; --hole-edge: #6E7A12;
  --def: #1E2A46; --def-ink: #F3F6FB; --zone: #1E2A46;
  --r-orange: #E2711C; --r-green: #15634F; --r-purple: #7B3DB6; --r-red: #D23229; --r-ink: #1A1A1A; --ball: #7A4522;
  --good: #1D8A4B; --warn: #B87D05; --bad: #C1362B;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1410; --panel: #151D17; --ink: #E5ECE4; --muted: #92A196; --line: #26332A; --chip: #1D2820;
    --accent: #79CF96; --accent-ink: #0E1410;
    --turf: #1D3A25; --turf-2: #21412A; --chalk: #CFE3D0; --hole: #E2EA45; --hole-edge: #E2EA45;
    --def: #DCE4F4; --def-ink: #17203A; --zone: #A9BCE6;
    --r-orange: #F5953F; --r-green: #3FC79C; --r-purple: #B78BF2; --r-red: #FF6A5C; --r-ink: #F4F4F0; --ball: #C98A57;
    --good: #4CC27A; --warn: #E3AE3A; --bad: #F06B5E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1410; --panel: #151D17; --ink: #E5ECE4; --muted: #92A196; --line: #26332A; --chip: #1D2820;
  --accent: #79CF96; --accent-ink: #0E1410;
  --turf: #1D3A25; --turf-2: #21412A; --chalk: #CFE3D0; --hole: #E2EA45; --hole-edge: #E2EA45;
  --def: #DCE4F4; --def-ink: #17203A; --zone: #A9BCE6;
  --r-orange: #F5953F; --r-green: #3FC79C; --r-purple: #B78BF2; --r-red: #FF6A5C; --r-ink: #F4F4F0; --ball: #C98A57;
  --good: #4CC27A; --warn: #E3AE3A; --bad: #F06B5E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.app { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 16px 40px; display: grid; gap: 16px; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, .cov:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 900; font-size: 34px; line-height: .9; letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
.mark { width: 44px; height: 44px; flex: none; }
.play-pick { display: flex; align-items: center; gap: 8px; }
.play-pick label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.play-pick select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 70vw; }

/* Main grid */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.stage { display: grid; gap: 12px; min-width: 0; }

.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.playhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.playhead h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; margin: 2px 0 0; text-wrap: balance; text-transform: uppercase; letter-spacing: .01em; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--chip); color: var(--ink); font-weight: 500; }
.tag.mod { background: var(--hole); color: #1d2208; font-weight: 700; }
.linkbtn { background: none; border: 0; padding: 3px 4px; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

/* Coverage tray */
.tray { display: grid; gap: 8px; }
.tray-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cov { display: grid; grid-template-columns: minmax(0,1fr); align-content: start; gap: 6px; padding: 8px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--panel); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; text-align: left; }
.cov:hover { border-color: var(--muted); }
.cov[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cov svg { width: 100%; height: auto; aspect-ratio: 64 / 34; border-radius: 5px; display: block; }
.cov b { display: block; font-family: var(--f-display); font-size: 19px; font-weight: 800; line-height: 1; text-transform: uppercase; }
.cov small { color: var(--muted); font-size: 12px; line-height: 1.2; display: block; margin-top: 2px; }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 10px 28px rgba(0,0,0,.25); width: 170px; opacity: .95; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; cursor: pointer; }
.tog input { accent-color: var(--accent); margin: 0; }

/* Field */
.field-wrap { position: relative; border-radius: 14px; overflow: hidden; background: var(--turf); border: 1px solid var(--line); }
.field-wrap svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 150px); margin: 0 auto; touch-action: pan-y; }
.field-wrap.drop-ready::after { content: "Drop to overlay this coverage"; position: absolute; inset: 10px; border: 2.5px dashed var(--chalk); border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-size: 24px; font-weight: 800; text-transform: uppercase; color: var(--chalk); background: color-mix(in srgb, var(--turf) 40%, transparent); pointer-events: none; }
.field-wrap.drop-over::after { background: color-mix(in srgb, var(--hole) 30%, transparent); }
.def { cursor: grab; }
.def.locked { cursor: default; }
.lbl { font-family: var(--f-body); font-weight: 700; }

/* Timeline */
.timeline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.playbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
.playbtn svg { width: 16px; height: 16px; fill: currentColor; }
.track { position: relative; padding-block: 14px 16px; }
.track input { width: 100%; margin: 0; accent-color: var(--accent); }
.marks { position: absolute; left: 9px; right: 9px; top: 0; bottom: 0; pointer-events: none; }
.mk { position: absolute; transform: translateX(-50%); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.mk.top { top: -2px; }
.mk.bot { bottom: -2px; }
.mk.rush { color: var(--bad); }
.mk.throw { color: var(--ink); }
.mk.tick { color: var(--muted); font-weight: 500; }
.clock { text-align: right; min-width: 74px; }
.clock b { font-family: var(--f-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; display: block; }
.clock span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.speed { display: flex; gap: 4px; }
.speed button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 7px; font-size: 12px; cursor: pointer; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hint { margin: 0; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.key { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Read panel */
.read { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h3 { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; margin: 0; letter-spacing: .01em; line-height: 1; }
.scout-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sc { border: 1.5px solid var(--line); background: var(--paper); border-radius: 9px; padding: 7px 4px 6px; display: grid; justify-items: center; gap: 2px; cursor: pointer; }
.sc[aria-pressed="true"] { border-color: var(--ink); }
.sc span { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.g { font-family: var(--f-display); font-weight: 900; line-height: 1; }
.sc .g { font-size: 26px; }
.gA, .gB { color: var(--good); } .gC { color: var(--warn); } .gD, .gF { color: var(--bad); }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.bigg { font-size: 64px; width: 64px; text-align: center; margin-top: -4px; }
.verdict h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1; margin: 2px 0 6px; text-wrap: balance; }
.verdict p { margin: 0; }
.reads { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.reads li button { width: 100%; display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) 72px; align-items: center; gap: 8px; padding: 7px 6px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; }
.reads li button:hover { background: var(--paper); }
.num { font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
.rname { min-width: 0; }
.rname b { font-weight: 600; }
.rname small { display: block; color: var(--muted); font-size: 12px; }
.bar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 7px; border-radius: 99px; text-align: center; }
.p-open { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.p-tight { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.p-covered { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.sug { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; background: var(--paper); }
.sug-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sug-top .arrow { color: var(--muted); }
.delta { margin-left: auto; font-family: var(--f-display); font-weight: 800; font-size: 18px; white-space: nowrap; }
.sug p { margin: 0; font-size: 14px; }
.sug .muted { color: var(--muted); font-size: 13px; }
.sug-actions { display: flex; gap: 8px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-size: 14px; }
.btn.ghosty { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn:hover { filter: brightness(1.08); }
dl.notes { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 14px; }
dl.notes dt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 2px; }
dl.notes dd { margin: 0; }
.concepts { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
dl.notes .linkbtn { padding: 0; font-size: 14px; text-align: left; }
.src { font-size: 12px; color: var(--muted); margin: 0; }
.empty { color: var(--muted); margin: 0; }
/* Play actions, studio dialog, toast */
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.act { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
.act:hover { border-color: var(--muted); }
.act[aria-pressed="true"] { background: var(--hole); color: #1d2208; border-color: var(--hole-edge); }
.act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.act.danger { color: var(--bad); }
.act:disabled { opacity: .55; cursor: progress; }
.act svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(10, 16, 12, .55); display: grid; place-items: center; padding-inline: 16px; padding-block: 16px; }
.dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px; display: grid; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.dialog h3 { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; margin: 0; line-height: 1; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 8px 10px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2.5px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { display: grid; gap: 10px; }
.pane textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--paper); font: inherit; color: inherit; }
.pane input[type=file] { font-size: 14px; max-width: 100%; }
.pane .muted { color: var(--muted); font-size: 13px; margin: 0; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 4px 10px; font-size: 12px; cursor: pointer; text-align: left; }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.status.err { color: var(--bad); }
.preview-img { max-height: 160px; border-radius: 8px; border: 1px solid var(--line); justify-self: start; }
.sharebox { display: grid; gap: 6px; }
.sharebox input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); font-size: 13px; }
.gifout { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
        <rect width="44" height="44" rx="10" style="fill:var(--accent)"/>
        <path d="M6 30h32M6 18h32" style="stroke:var(--accent-ink);stroke-opacity:.35" stroke-width="1.5"/>
        <ellipse cx="25" cy="24" rx="11" ry="7" style="fill:var(--hole);stroke:#1d2208" stroke-width="1.2"/>
        <circle cx="13" cy="13" r="3.2" style="fill:var(--accent-ink)"/>
        <circle cx="33" cy="12" r="3.2" style="fill:var(--accent-ink)"/>
      </svg>
      <div><h1>Open Grass</h1><p>Find the hole. Beat the coverage.</p></div>
    </div>
    <div class="head-actions">
      <div class="play-pick">
        <label for="playSel">Play</label>
        <select id="playSel"></select>
      </div>
      <button class="act primary" id="newPlayBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New play</button>
      <button class="act" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Export favorites</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="playhead">
        <div>
          <div class="eyebrow">On the field</div>
          <h2 id="playName"></h2>
        </div>
        <div class="tags" id="playTags"></div>
      </div>
      <div class="actions" id="actions">
        <button class="act" id="favBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Favorite</span></button>
        <button class="act" id="shareBtn"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Share link</button>
        <button class="act" id="gifBtn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Save GIF</button>
        <button class="act primary" id="saveDraftBtn" hidden>Save to My plays</button>
        <button class="act danger" id="deletePlayBtn" hidden>Delete play</button>
      </div>

      <div class="tray">
        <div class="tray-head">
          <span class="eyebrow">Defense · drag a coverage onto the field, or tap it</span>
          <div class="toggles">
            <label class="tog"><input type="checkbox" id="blitzT"> LB/FS blitz</label>
            <label class="tog"><input type="checkbox" id="holesT" checked> Show holes</label>
          </div>
        </div>
        <div class="cards" id="cards"></div>
      </div>

      <div class="field-wrap" id="fieldWrap">
        <svg id="field" viewBox="0 0 360 336" role="img" aria-label="Field diagram of the play against the selected coverage"></svg>
      </div>

      <div class="timeline">
        <button class="playbtn" id="playBtn" aria-label="Run the play"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></button>
        <div class="track">
          <input type="range" id="scrub" min="0" max="4" step="0.05" value="0" aria-label="Time after the snap">
          <div class="marks" id="marks"></div>
        </div>
        <div class="clock"><b id="clockT">0.0s</b><span id="clockL">Pre-snap</span></div>
      </div>
      <p class="hint">
        <span class="key"><i class="sw" style="background:var(--hole);outline:1px solid var(--hole-edge)"></i>Open grass</span>
        <span class="key"><i class="sw" style="background:var(--zone);opacity:.35"></i>Zone</span>
        <span class="key"><i class="sw" style="background:var(--good)"></i>Open</span>
        <span class="key"><i class="sw" style="background:var(--warn)"></i>Tight</span>
        <span class="key"><i class="sw" style="background:var(--bad)"></i>Covered</span>
        <span id="dragHint">Pre-snap: drag any defender to match what you see.</span>
        <span class="speed" role="group" aria-label="Playback speed"><button data-sp="0.5" aria-pressed="true">½×</button><button data-sp="1" aria-pressed="false">1×</button></span>
      </p>
    </section>

    <aside class="read" id="read"></aside>
  </main>
</div>

<div class="scrim" id="scrim" hidden>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const clone = o => JSON.parse(JSON.stringify(o));

function turnAngle(a, b, c) {
  const v1 = [b[0] - a[0], b[1] - a[1]], v2 = [c[0] - b[0], c[1] - b[1]];
  const m = Math.hypot(...v1) * Math.hypot(...v2);
  if (!m) return 0;
  return Math.acos(clamp((v1[0] * v2[0] + v1[1] * v2[1]) / m, -1, 1)) * 180 / Math.PI;
}

/* Turn a player's route into timed keyframes; sharp cuts cost a beat and are remembered (man defenders lose a step there). */
function buildPath(pl) {
  const pts = [[pl.start[0], pl.start[1], 0], ...pl.route.map(p => [p[0], p[1], p[2] || 0])];
  let t = pl.delay || 0;
  const keys = [{ t: 0, p: [pts[0][0], pts[0][1]] }, { t, p: [pts[0][0], pts[0][1]] }];
  const cuts = [], ptTimes = [t];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if (i >= 2 && turnAngle(pts[i - 2], a, b) > 45) { t += 0.12; keys.push({ t, p: [a[0], a[1]] }); cuts.push(t); }
    t += dist(a, b) / pl.speed;
    keys.push({ t, p: [b[0], b[1]] });
    ptTimes.push(t);
    if (b[2]) { t += b[2]; keys.push({ t, p: [b[0], b[1]] }); }
  }
  return { keys, cuts, ptTimes, window: catchWindow(pts, ptTimes, pl) };
}

/* When a receiver starts looking for the ball: out of the first break, or 7 yards into a straight vertical. */
function catchWindow(pts, ptTimes, pl) {
  const i = pts.findIndex((p, k) => k > 0 && p[1] >= 0);
  if (i < 0) return Infinity;
  const prev = pts[i - 1];
  const vertical = i === pts.length - 1 && pts[i][1] >= 10 && Math.abs(pts[i][0] - prev[0]) < 4;
  if (!vertical) return ptTimes[i];
  const y0 = Math.max(prev[1], 0), frac = clamp((7 - prev[1]) / (pts[i][1] - prev[1]), 0, 1);
  return ptTimes[i - 1] + (ptTimes[i] - ptTimes[i - 1]) * frac + (y0 > 7 ? 0 : 0);
}

function posAt(path, t) {
  const k = path.keys;
  if (t <= k[0].t) return [...k[0].p];
  for (let i = 1; i < k.length; i++) {
    if (t <= k[i].t) {
      const span = k[i].t - k[i - 1].t || 1;
      const u = (t - k[i - 1].t) / span;
      return [k[i - 1].p[0] + (k[i].p[0] - k[i - 1].p[0]) * u, k[i - 1].p[1] + (k[i].p[1] - k[i - 1].p[1]) * u];
    }
  }
  return [...k[k.length - 1].p];
}

function clampToEllipse(p, z) {
  const dx = p[0] - z.c[0], dy = p[1] - z.c[1];
  const n = Math.sqrt((dx / z.rx) ** 2 + (dy / z.ry) ** 2);
  return n <= 1 ? [...p] : [z.c[0] + dx / n, z.c[1] + dy / n];
}

function buildDefense(covId, play, opts = {}) {
  const T = COVERAGES[covId];
  const defs = T.defenders.map(d => ({ ...clone(d), role: d.man ? 'man' : 'zone' }));
  if (covId === 'man') {
    const elig = play.players.filter(p => p.eligible).slice().sort((a, b) => a.start[0] - b.start[0] || b.start[1] - a.start[1]);
    const mids = elig.slice(1, -1).sort((a, b) => b.start[1] - a.start[1]);
    const assign = { CBL: elig[0], CBR: elig[elig.length - 1], LB: mids[0], SS: mids[1] };
    defs.forEach(d => {
      if (d.role !== 'man') return;
      const r = assign[d.id];
      if (!r) { d.role = 'zone'; d.pos = [MID, 8]; d.zone = { c: [MID, 8], rx: 5, ry: 4 }; return; }
      d.man = r.id;
      d.pos = r.start[1] >= -0.5 ? [r.start[0], 4.5] : [r.start[0] + (r.start[0] <= MID ? -3 : 3), 5];
    });
  }
  if (opts.blitz) {
    const b = defs.find(d => d.id === T.blitzer);
    if (b) { b.role = 'rush'; b.pos = [MID, 7]; }
  }
  const nudges = opts.nudges || {};
  defs.forEach(d => {
    const n = nudges[d.id];
    if (!n || d.role === 'rush') return;
    d.pos = [d.pos[0] + n[0], d.pos[1] + n[1]];
    if (d.zone) d.zone.c = [d.zone.c[0] + n[0], d.zone.c[1] + n[1]];
  });
  return { id: covId, defenders: defs };
}

function simulate(play, defense, opts = {}) {
  const paths = {};
  const ho = play.handoff;

    // the ball carrier keeps running upfield after the drawn path ends
    const pl = ho && ho.to === p.id && !ho.thenPass ? { ...p, route: [...p.route, [p.route[p.route.length - 1][0], 40]] } : p;
    paths[p.id] = buildPath(pl);
  });

<script>
/* ---------- AI: describe a play, or read a diagram ----------
   AI drafting goes through the Open Grass Worker (worker/ folder), which holds the Anthropic key
   and the play-drawing prompts. Set AI_ENDPOINT to the Worker's URL after `npm run deploy`;
   leave it empty and the New play dialog shows AI drafting as unavailable.
   Never put API keys in this file: it ships to every browser. */
const AI_ENDPOINT = 'https://open-grass-ai.thurby-labs.workers.dev';
const AI_IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
const AI_MAX_IMAGE = 5 * 1024 * 1024;

function aiProvider() {
  if (!AI_ENDPOINT) return null;
  return {
    // input: { description } or { image: File }. Resolves to the raw play object; throws { code }.
    async json(input, { signal } = {}) {
      let body;
      if (input.image) {
        const f = input.image;
        if (!AI_IMAGE_TYPES.includes(f.type)) throw { code: 'image_rejected' };
        if (f.size > AI_MAX_IMAGE) throw { code: 'image_too_large' };
        body = { image: { mediaType: f.type, data: await fileToBase64(f) } };
      } else body = { description: input.description };
      let res;
      try {
        res = await fetch(AI_ENDPOINT.replace(/\/$/, '') + '/draft', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal
        });
      } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'network' }; }
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.play) throw { code: (data && data.code) || 'upstream_error' };
      return data.play;
    },
    limits: async () => ({ images: { mediaTypes: AI_IMAGE_TYPES } })
  };
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject({ code: 'image_rejected' });
    r.readAsDataURL(file);
  });
}

let aiCtl = null;
async function askAI(input, statusEl) {
  const ai = aiProvider();

const AI_UNAVAILABLE = 'AI drafting needs the AI-enabled version of Open Grass. You can still import a play file.';
const AI_ERRORS = {

  rate_limited: 'Too many requests right now. Wait a minute and try again.',
  image_rejected: 'That image couldn’t be read. Try a PNG or JPG screenshot.', images_unavailable: 'Reading images isn’t available here. Describe the play instead.',
  refused: 'The AI couldn’t draw that one. Try describing it differently.', invalid_json: 'The answer didn’t come back as a play. Try again or add more detail.',
  empty_completion: 'No answer came back. Add more detail and try again.', prompt_too_large: 'That’s too long. Shorten the description.',
  image_too_large: 'That image is over 5 MB. Try a smaller screenshot.', network: 'Couldn’t reach the AI. Check your connection and try again.'

function toast(msg) {

  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2800);

/* Each coach's plays and favorites live in this browser's storage (no account or backend). */
const store = {

      if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null');

    } catch (e) { if (v !== undefined) throw e; return null; }
  },
  async loadMine() { return this.local('og-mine') || []; },

  },

    let r = raw.players.find(p => p && String(p.id || p.label || '').toUpperCase() === pid);

      routeName: String(r.routeName || (pid === 'Q' ? 'Drop' : 'Route')).slice(0, 40),

    players.push(p);

  if (players.filter(p => p.eligible).length < 2) throw new Error('A play needs at least two receivers.');

    const to = String(raw.handoff.to || '').toUpperCase(), c = players.find(p => p.id === to && p.eligible);

      if (raw.handoff.thenPass || raw.type === 'trick') handoff.thenPass = true;

    id: id || 'u' + rid(), series: 'mine',
    name: String(raw.name || 'Untitled play').replace(/^\d+\s*·\s*/, '').slice(0, 80),

    loadPlay(PLAYS[0]);
    toast('Play deleted.');
  } catch (e) { toast('Couldn’t delete the play. Try again.'); }
});

$('favBtn').addEventListener('click', async () => {
  if (state.play.draft) return;
  if (state.play.shared) { await saveCurrentAsMine(); }
  const id = state.basePlay.id;
  const on = !library.favs.includes(id);
  library.favs = on ? [...library.favs, id] : library.favs.filter(f => f !== id);
  store.saveFavs(library.favs);
  buildSelect(); renderHead();
  toast(on ? 'Added to favorites.' : 'Removed from favorites.');
});

/* ---------- share links ---------- */
// Only a plain #token reaches the page from a link, so the token is "<playId>.<coverage>" for a built-in play,
// or "j-<packed play>.<coverage>" for a custom, edited or draft play (the whole play rides in the link).
function openShare() {
  const custom = state.play.draft || state.play.mine || state.play.shared || Object.keys(state.changes).length > 0;
  const covTok = state.cov || 'none';
  let url = '', err = '';
  try { url = `${SITE_URL}#${custom ? 'j-' + packPlay(stripFlags(state.play)) : state.basePlay.id}.${covTok}`; }
  catch (e) { err = 'Couldn’t create the link. Try again.'; }
  const note = custom
    ? 'This play is stored in the link itself, so anyone with it can open it. They can save it to their own My plays.'
    : 'Anyone with the link can open it.';
  openDialog(`${dlgHead('Share this play')}
    <div class="sharebox">
      <label class="eyebrow" for="shareUrl">Link</label>
      <input id="shareUrl" readonly value="${esc(url)}">
      <div><button class="act primary" id="copyLink" ${url ? '' : 'disabled'}>Copy link</button></div>
      <p class="status${err ? ' err' : ''}" id="shareStatus">${err || `Opens ${esc(state.play.name)} vs ${state.cov ? COVERAGES[state.cov].name : 'no defense'}. ${note}`}</p>
    </div>`);
  $('copyLink').addEventListener('click', async () => {
    const inp = $('shareUrl');
    try { await navigator.clipboard.writeText(inp.value); toast('Link copied.'); }
    catch (e) { inp.focus(); inp.select(); toast('Press Ctrl+C or ⌘C to copy.'); }
  });
}
$('shareBtn').addEventListener('click', openShare);

/* ---------- GIF: render each frame of the field and encode an animated GIF ---------- */
function lzwEncode(px, out) {
  const minSize = 8, clear = 256, eoi = 257;
  let codeSize = 9, next = 258, dict = new Map(), cur = 0, bits = 0;
  const buf = [];
  const emit = c => {
    cur |= c << bits; bits += codeSize;
    while (bits >= 8) { buf.push(cur & 255); cur >>>= 8; bits -= 8; }
    if (next > (1 << codeSize) - 1 && codeSize < 12) codeSize++;
  };
  out.push(minSize);
  emit(clear);
  let prefix = px[0];
  for (let i = 1; i < px.length; i++) {
    const k = px[i], key = (prefix << 8) | k, v = dict.get(key);
    if (v !== undefined) { prefix = v; continue; }
    emit(prefix);
    if (next < 4096) dict.set(key, next++);
    else { emit(clear); dict = new Map(); codeSize = 9; next = 258; }
    prefix = k;
  }
  emit(prefix); emit(eoi);
  if (bits > 0) buf.push(cur & 255);
  for (let i = 0; i < buf.length; i += 255) {
    const n = Math.min(255, buf.length - i);
    out.push(n);
    for (let j = 0; j < n; j++) out.push(buf[i + j]);
  }
  out.push(0);
}
function encodeGif(frames, w, h, palette) {
  const out = [];
  const b = v => out.push(v & 255), w16 = v => { b(v); b(v >> 8); }, str = s => { for (const ch of s) b(ch.charCodeAt(0)); };
  str('GIF89a'); w16(w); w16(h); b(0xF7); b(0); b(0);
  for (let i = 0; i < 256; i++) { const c = palette[i] || [0, 0, 0]; b(c[0]); b(c[1]); b(c[2]); }
  b(0x21); b(0xFF); b(11); str('NETSCAPE2.0'); b(3); b(1); w16(0); b(0);
  for (const f of frames) {
    b(0x21); b(0xF9); b(4); b(0); w16(f.delay); b(0); b(0);
    b(0x2C); w16(0); w16(0); w16(w); w16(h); b(0);
    lzwEncode(f.idx, out);
  }
  b(0x3B);
  return new Uint8Array(out);
}
const bucket = (r, g, b) => ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
function buildPalette(samples) {
  const counts = new Map();
  for (const d of samples) for (let i = 0; i < d.length; i += 8) { const k = bucket(d[i], d[i + 1], d[i + 2]); counts.set(k, (counts.get(k) || 0) + 1); }
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 256)
    .map(([k]) => [((k >> 10) & 31) << 3 | 4, ((k >> 5) & 31) << 3 | 4, (k & 31) << 3 | 4]);
}
function indexer(palette) {
  const cache = new Int16Array(32768).fill(-1);
  return (d) => {
    const idx = new Uint8Array(d.length / 4);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const k = bucket(d[i], d[i + 1], d[i + 2]);
      let c = cache[k];
      if (c < 0) {
        let best = 0, bd = Infinity;
        const r = ((k >> 10) & 31) << 3 | 4, g = ((k >> 5) & 31) << 3 | 4, bl = (k & 31) << 3 | 4;
        for (let p = 0; p < palette.length; p++) {
          const q = palette[p], dd = (q[0] - r) ** 2 + (q[1] - g) ** 2 + (q[2] - bl) ** 2;
          if (dd < bd) { bd = dd; best = p; }
        }
        c = cache[k] = best;
      }
      idx[j] = c;
    }
    return idx;
  };
}
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
async function renderGif(progress) {
  const W = 540, FH = 504, CAP = 46, H = FH + CAP, fps = 10, T = tEnd();
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const cs = getComputedStyle(document.documentElement);
  const tok = v => cs.getPropertyValue(v).trim() || '#000';
  const resolve = s => s.replace(/var\((--[\w-]+)\)/g, (m, v) => tok(v))
    .replace(/class="lbl"/g, 'font-family="Barlow, Arial, sans-serif" font-weight="700"')
    .replace(/class="def[^"]*"/g, '');
  const title = `${state.play.name}  ·  vs ${state.cov ? COVERAGES[state.cov].name : 'no defense'}${state.blitz ? ' + blitz' : ''}`;
  const draw = async t => {
    const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" width="${W}" height="${FH}">${resolve(fieldMarkup(t))}</svg>`;
    const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr));
    ctx.fillStyle = tok('--panel'); ctx.fillRect(0, 0, W, CAP);
    ctx.fillStyle = tok('--ink'); ctx.font = '700 17px Barlow, Arial, sans-serif'; ctx.textBaseline = 'middle';
    let tt = title; while (ctx.measureText(tt).width > W - 130 && tt.length > 10) tt = tt.slice(0, -2);
    ctx.fillText(tt === title ? tt : tt + '…', 14, CAP / 2);
    ctx.fillStyle = tok('--muted'); ctx.font = '600 13px Barlow, Arial, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`${t.toFixed(1)}s · Open Grass`, W - 14, CAP / 2); ctx.textAlign = 'left';
    ctx.drawImage(img, 0, CAP, W, FH);
    return ctx.getImageData(0, 0, W, H).data;
  };
  const times = [];
  for (let k = 0; k <= Math.round(T * fps); k++) times.push(k / fps);
  const samples = [];
  for (const t of [0, T / 3, (2 * T) / 3, T]) samples.push(await draw(t));
  const palette = buildPalette(samples), toIdx = indexer(palette);
  const frames = [];
  for (let i = 0; i < times.length; i++) {
    frames.push({ idx: toIdx(await draw(times[i])), delay: i === 0 ? 80 : i === times.length - 1 ? 180 : 10 });
    progress(i / times.length);
    if (i % 4 === 3) await new Promise(r => setTimeout(r, 0));
  }
  return new Blob([encodeGif(frames, W, H, palette)], { type: 'image/gif' });
}
const slug = s => s.replace(/^\d+\s*·\s*/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'play';
const MIME = { gif: 'image/gif', json: 'application/json', csv: 'text/csv;charset=utf-8' };
function saveFile(filename, data) {
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: MIME[filename.split('.').pop()] || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return true;
  } catch (e) { toast('Couldn’t save the file. Try again.'); return false; }
}
$('gifBtn').addEventListener('click', async () => {
  const b = $('gifBtn'), label = b.lastChild;
  if (!state.run) { toast('Drop a coverage on the field first.'); return; }
  stop();
  const keepT = state.t;
  b.disabled = true;
  let blob;
  try { blob = await renderGif(p => { label.textContent = `Rendering ${Math.round(p * 100)}%`; }); }
  catch (e) { toast('Couldn’t make the GIF. Try again.'); }
  finally { b.disabled = false; label.textContent = 'Save GIF'; setT(keepT); }
  if (!blob) return;
  const url = URL.createObjectURL(blob);
  const name = `${slug(state.play.name)}-vs-${state.cov}.gif`;
  openDialog(`${dlgHead('Animated play')}
    <img class="gifout" src="${url}" alt="Animated GIF of ${esc(state.play.name)}">
    <p class="status">${(blob.size / 1024 / 1024).toFixed(1)} MB · ${esc(name)}</p>
    <div><button class="act primary" id="gifSave">Save GIF</button></div>`, () => URL.revokeObjectURL(url));
  $('gifSave').addEventListener('click', async () => { if (await saveFile(name, blob)) toast('GIF saved.'); });
});

/* ---------- export favorites ---------- */
$('exportBtn').addEventListener('click', () => {
  const favs = library.favs.map(findPlay).filter(Boolean);
  if (!favs.length) { toast('Star a play with Favorite first.'); return; }
  openDialog(`${dlgHead('Export favorites')}
    <p class="status">${favs.length} favorite play${favs.length > 1 ? 's' : ''}: ${favs.map(p => esc(p.name)).join(', ')}</p>
    <div class="pane">
      <div><button class="act primary" id="expJson">Playbook file (.json)</button></div>
      <p class="muted">Every route and alignment. Import it on another device with New play → Import file, or share it with another coach.</p>
      <div><button class="act" id="expCsv">Scouting sheet (.csv)</button></div>
      <p class="muted">One row per play with its grade against Cover 1, 2, 3 and Man. Opens in Excel or Google Sheets.</p>
    </div>`);
  $('expJson').addEventListener('click', async () => {
    const data = JSON.stringify({ app: 'Open Grass', format: 1, exportedAt: new Date().toISOString(), plays: favs.map(stripFlags) }, null, 1);
    if (await saveFile('open-grass-favorites.json', data)) toast('Playbook file saved.');
  });
  $('expCsv').addEventListener('click', async () => {
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const rows = [['Play', 'Type', 'Concept', ...COV_ORDER.map(c => COVERAGES[c].name), ...COV_ORDER.map(c => COVERAGES[c].name + ' + blitz')]];
    favs.forEach(p => rows.push([p.name, p.type, p.concept,
      ...COV_ORDER.map(c => runPlay(p, c, {}).ev.grade), ...COV_ORDER.map(c => runPlay(p, c, { blitz: true }).ev.grade)]));
    if (await saveFile('open-grass-favorites.csv', rows.map(r => r.map(q).join(',')).join('\n'))) toast('Scouting sheet saved.');
  });
});
$('newPlayBtn').addEventListener('click', () => openStudio());

/* ---------- startup: links, then the coach's saved plays and favorites ---------- */
function parseHash() {
  const m = /^(s-|j-)?([A-Za-z0-9_~-]+)(?:\.(c1|c2|c3|man|none))?$/.exec((location.hash || '').slice(1));
  return m ? { shared: !!m[1], packed: m[1] === 'j-', id: m[2], cov: m[3] === 'none' ? null : m[3] } : null;
}
const link = parseHash();
if (link && !link.shared) {
  const p = PLAYS.find(x => x.id === link.id);
  if (p) loadPlay(p, link.cov === undefined ? state.cov : link.cov);
}
(async () => {
  try {
    const [mine, favs] = await Promise.all([store.loadMine(), store.loadFavs()]);
    library.mine = mine.map(p => { try { const n = normalizePlay(p, p.id); n.mine = true; return n; } catch (e) { return null; } }).filter(Boolean);
    library.favs = favs.filter(id => typeof id === 'string');
  } catch (e) { toast('Couldn’t load your saved plays.'); }
  if (link && link.shared) {
    try {
      // "s-" links came from the old hosted version, whose shared plays lived in its database
      const raw = link.packed ? unpackPlay(link.id) : null;
      if (raw) {
        const p = normalizePlay(raw, 's' + shortHash(link.id)); p.shared = true; p.series = 'shared';
        library.shared.push(p);
        library.version++;
        loadPlay(p, link.cov === undefined ? state.cov : link.cov);
        return;
      }
      toast('That shared play link is from an older version of Open Grass and can’t be opened here.');
    } catch (e) { toast('Couldn’t open the shared play.'); }
  } else if (!link) {
    let saved = null;
    try { saved = localStorage.getItem('og-play'); } catch (e) {}
    const p = saved && library.mine.find(x => x.id === saved);
    if (p) { library.version++; loadPlay(p); return; }
  }
  library.version++;
  buildSelect(); renderHead();
})();

</script>
